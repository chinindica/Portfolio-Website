        <path d="M-5 -64 L5 -64 L7 -16 L-7 -16Z" transform="rotate(0)"/><path d="M-5 -64 L5 -64 L7 -16 L-7 -16Z" transform="rotate(12)"/>
        <path d="M-5 -64 L5 -64 L7 -16 L-7 -16Z" transform="rotate(72)"/><path d="M-5 -64 L5 -64 L7 -16 L-7 -16Z" transform="rotate(84)"/>
        <path d="M-5 -64 L5 -64 L7 -16 L-7 -16Z" transform="rotate(144)"/><path d="M-5 -64 L5 -64 L7 -16 L-7 -16Z" transform="rotate(156)"/>
        <path d="M-5 -64 L5 -64 L7 -16 L-7 -16Z" transform="rotate(216)"/><path d="M-5 -64 L5 -64 L7 -16 L-7 -16Z" transform="rotate(228)"/>
        <path d="M-5 -64 L5 -64 L7 -16 L-7 -16Z" transform="rotate(288)"/><path d="M-5 -64 L5 -64 L7 -16 L-7 -16Z" transform="rotate(300)"/>
        <circle r="66" fill="none" stroke="#e0301e" stroke-width="2.5"/>
      </g>
      <circle r="18" fill="#2b2c2f"/><circle r="7" fill="#8d9094"/>
    </g>
  </defs>
  <ellipse cx="550" cy="706" rx="300" ry="9" fill="#000" opacity=".5"/>
