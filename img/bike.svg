<svg xmlns="http://www.w3.org/2000/svg" viewBox="220 320 660 400" class="moto">
  <defs>
    <linearGradient id="fr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8443a"/><stop offset=".55" stop-color="#cf2a22"/><stop offset="1" stop-color="#9e1913"/></linearGradient>
    <linearGradient id="tk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f05a4f"/><stop offset="1" stop-color="#c22820"/></linearGradient>
    <linearGradient id="su" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e2f33"/><stop offset="1" stop-color="#151618"/></linearGradient>
    <linearGradient id="ch" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d9094"/><stop offset=".5" stop-color="#e4e6e8"/><stop offset="1" stop-color="#9a9da1"/></linearGradient>
    <radialGradient id="hl" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#e9e8e4"/><stop offset="1" stop-color="#b9b8b4"/></radialGradient>
    <g id="wheel">
