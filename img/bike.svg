  <path d="M732 494 L750 566" stroke="url(#ch)" stroke-width="10" stroke-linecap="round"/>
  <g transform="translate(758 616)"><use href="#wheel"/><circle r="46" fill="none" stroke="#a9acaf" stroke-width="8" stroke-dasharray="4 6"/><rect x="-46" y="-14" width="16" height="30" rx="4" fill="#e0301e"/></g>
  <path d="M700 566 C730 540 784 540 810 560 L800 572 C774 558 736 560 712 580 Z" fill="url(#fr)"/>
