  <!-- rider: tucked in a race suit -->
  <g class="rider" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- leg: hip to knee along the tank, shin back to the peg -->
    <path d="M500 468 L598 512 L568 590" stroke="#141416" stroke-width="50"/>
    <path d="M500 468 L598 512 L568 590" stroke="#c9241c" stroke-width="40"/>
    <path d="M520 470 L594 504" stroke="#f2f0eb" stroke-width="5"/>
    <path d="M548 596 L600 600" stroke="#141416" stroke-width="20"/>
    <!-- torso, tucked over the tank -->
    <path d="M498 462 C530 420 590 396 650 398" stroke="#141416" stroke-width="74"/>
    <path d="M498 462 C530 420 590 396 650 398" stroke="#d22a21" stroke-width="62"/>
    <path d="M500 438 C534 404 584 384 640 380" stroke="#f2f0eb" stroke-width="6"/>
    <path d="M512 452 C544 420 590 402 642 398" stroke="#f4c21b" stroke-width="3.5"/>
