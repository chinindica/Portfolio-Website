  <path d="M692 452 L722 414 L756 440 L774 484 L744 500 L702 472 Z" fill="url(#fr)"/>
  <path d="M744 470 L772 482 L762 494 L742 486 Z" fill="#fff4cf"/>
  <path d="M706 412 L722 384 L748 394 L754 432 L726 420 Z" fill="#28323a" opacity=".92"/>
