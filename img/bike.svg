    <path d="M640 404 L668 440 L690 432" stroke="#141416" stroke-width="30"/>
    <path d="M640 404 L668 440 L690 432" stroke="#c9241c" stroke-width="20"/>
    <circle cx="692" cy="432" r="11" fill="#141416" stroke="none"/>
    <text x="548" y="434" font-family="Arial Narrow,Arial,sans-serif" font-weight="900" font-style="italic" font-size="22" fill="#f2f0eb" stroke="none" transform="rotate(-24 548 434)">95</text>
    <!-- helmet, white and red, visor down -->
    <g stroke="none">
      <path d="M640 384 C632 348 658 326 688 328 C716 330 732 352 728 380 C724 400 704 408 682 406 L646 402 Z" fill="url(#hl)"/>
      <path d="M642 362 C654 338 682 328 710 338 L718 352 C694 346 668 350 646 374 Z" fill="#d22a21"/>
      <path d="M688 356 C704 352 722 360 728 374 L724 388 C710 386 698 384 688 382 Z" fill="#1d262d"/>
      <path d="M694 361 C705 359 714 363 720 369" stroke="#6c8394" stroke-width="2" fill="none"/>
    </g>
  </g>
</g>
</svg>
