  <path d="M586 520 L660 500 L690 524 L650 590 L618 620 L600 590 Z" fill="#18191b"/>
  <path d="M600 520 L702 498 L708 508 L610 532 Z" fill="#f2f0eb"/>
  <path d="M594 542 L692 522 L698 532 L600 552 Z" fill="#c9cbce"/>
  <path d="M560 602 L640 606 L660 642 L600 652 L560 642 Z" fill="#b51f17"/>
