  <path d="M396 566 L486 584 L496 628 L410 612 Z" fill="#1a1b1d"/>
  <path d="M392 566 L410 562 L420 610 L402 614 Z" fill="#6f7276"/>
  <!-- engine -->
  <path d="M488 528 L606 518 L626 600 L566 628 L494 612 Z" fill="#2c2d30"/>
  <circle cx="548" cy="575" r="26" fill="#3b3d41"/><circle cx="548" cy="575" r="10" fill="#1d1e20"/>
  <path d="M600 540 L622 536 L630 590 L612 594Z" fill="#55585c"/>
  <!-- rear subframe, plate hanger -->
  <path d="M310 464 L424 476 L436 522 L392 514 Z" fill="#1b1c1e"/>
  <path d="M284 470 L302 470 L262 540 L250 534 Z" fill="#1b1c1e"/>
