<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 150" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- original CK95 rider on a red 250cc sport bike, side view facing right -->
  <ellipse cx="112" cy="140" rx="92" ry="6" fill="#000" opacity=".35"/>
  <!-- exhaust, swingarm -->
  <path d="M58 104 L104 106 L101 114 L60 112 Z" fill="#8d8f8a"/>
  <path d="M52 118 L104 102" stroke="#2a2b28" stroke-width="7" stroke-linecap="round"/>
  <!-- tail + seat -->
  <path d="M34 80 L98 74 L96 86 L54 92 Z" fill="#d7261e"/>
  <path d="M34 80 L46 76 L98 72 L98 76 Z" fill="#f2efe6"/>
  <!-- tank + fairing -->
  <path d="M90 96 L104 74 L148 64 L174 70 L196 92 L176 104 L118 108 Z" fill="#d7261e"/>
  <path d="M120 100 L150 72 L174 72 L192 92 L172 102 Z" fill="#b51d16"/>
  <path d="M104 74 L148 64 L152 70 L110 80 Z" fill="#f2efe6" opacity=".9"/>
  <path d="M158 66 L180 52 L186 74 Z" fill="#1b2a33" opacity=".85"/>
  <circle cx="194" cy="86" r="4" fill="#ffe7a8"/>
  <text x="132" y="96" font-family="Arial Narrow,Arial,sans-serif" font-weight="900" font-style="italic" font-size="15" fill="#f2efe6">CK95</text>
  <!-- fork -->
  <path d="M176 78 L184 118" stroke="#c9c6bb" stroke-width="4" stroke-linecap="round"/>
  <!-- rider: legs -->
  <path d="M100 70 L132 86 L118 104" fill="none" stroke="#c4211a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M112 104 L126 106" stroke="#141414" stroke-width="7" stroke-linecap="round"/>
  <!-- torso, tucked -->
  <path d="M96 72 C108 50 130 40 150 44 L156 56 C138 56 120 66 110 80 Z" fill="#e0301e"/>
  <path d="M104 64 C116 50 132 44 148 46" stroke="#f2efe6" stroke-width="3" fill="none"/>
  <path d="M124 54 C130 52 136 52 140 52" stroke="#f4c21b" stroke-width="3" fill="none"/>
  <!-- arm to bars -->
  <path d="M146 52 L164 64 L176 66" fill="none" stroke="#c4211a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="177" cy="66" r="4.5" fill="#141414"/>
  <!-- helmet -->
  <circle cx="160" cy="38" r="15" fill="#e0301e"/>
  <path d="M152 30 C162 26 172 30 175 38 L164 42 C160 38 156 36 152 36 Z" fill="#141c22"/>
  <path d="M146 40 C150 28 160 24 168 25" stroke="#f2efe6" stroke-width="2.5" fill="none"/>
  <!-- wheels (spin via .spin groups) -->
  <g class="spin" style="transform-origin:52px 118px"><circle cx="52" cy="118" r="21" fill="none" stroke="#141414" stroke-width="8"/><circle cx="52" cy="118" r="14" fill="none" stroke="#6d6f6a" stroke-width="2"/><path d="M52 104 V132 M38 118 H66 M42 108 L62 128 M62 108 L42 128" stroke="#6d6f6a" stroke-width="2"/><circle cx="52" cy="118" r="3" fill="#c9c6bb"/></g>
  <g class="spin" style="transform-origin:186px 118px"><circle cx="186" cy="118" r="21" fill="none" stroke="#141414" stroke-width="8"/><circle cx="186" cy="118" r="14" fill="none" stroke="#6d6f6a" stroke-width="2"/><path d="M186 104 V132 M172 118 H200 M176 108 L196 128 M196 108 L176 128" stroke="#6d6f6a" stroke-width="2"/><circle cx="186" cy="118" r="3" fill="#c9c6bb"/></g>
</svg>
