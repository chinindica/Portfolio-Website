<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 -10 860 680" class="side-rider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Chinmay on a red 250cc faired sport bike, side view. Flat cel style, ink outlines. -->
