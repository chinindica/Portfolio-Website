  <g class="wmark" style="transform-origin:1050px 474px"><circle cx="1050" cy="474" r="146" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="5" stroke-dasharray="26 70"/></g>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(8 26)">
