      <path d="M726 -14 C712 -86 766 -128 830 -124 C892 -120 922 -80 918 -28 C914 10 880 28 840 26 L748 24 Z" fill="url(#helmG)"/>
      <path d="M836 -78 C876 -84 912 -66 922 -36 L916 -6 C884 -10 856 -14 836 -16 C826 -36 826 -60 836 -78 Z" fill="#1d262d"/>
