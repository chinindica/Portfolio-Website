<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" class="rear-rider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Chinmay from behind on the sport bike, for the road scene. -->
  <ellipse cx="200" cy="452" rx="120" ry="14" fill="#000" opacity=".45"/>
  <g stroke="#151515" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- rear tyre with rolling tread -->
    <rect x="172" y="318" width="56" height="134" rx="24" fill="#1d1d1f"/>
    <clipPath id="tyre"><rect x="176" y="322" width="48" height="126" rx="20"/></clipPath>
    <g clip-path="url(#tyre)" stroke="#3b3c3f" stroke-width="5"><g class="tread"><path d="M176 300 L224 312 M176 324 L224 336 M176 348 L224 360 M176 372 L224 384 M176 396 L224 408 M176 420 L224 432 M176 444 L224 456 M176 468 L224 480"/></g></g>
    <!-- fairing flanks visible past the rider -->
    <path d="M96 236 C110 214 150 206 200 206 C250 206 290 214 304 236 L292 300 L108 300 Z" fill="#c4211a"/>
    <path d="M104 262 L150 250 L150 296 L112 296 Z" fill="#c9cbce"/><path d="M296 262 L250 250 L250 296 L288 296 Z" fill="#c9cbce"/>
    <!-- mirrors + bars -->
    <path d="M86 186 L60 150 M314 186 L340 150" stroke-width="6"/>
    <rect x="40" y="132" width="40" height="24" rx="8" fill="#1f1f21"/><rect x="320" y="132" width="40" height="24" rx="8" fill="#1f1f21"/>
    <!-- exhaust -->
    <path d="M246 328 L282 318 L296 360 L258 372 Z" fill="#242527"/><ellipse cx="277" cy="365" rx="15" ry="9" fill="#cfd1d4"/>
    <!-- legs bent out to the pegs -->
    <path d="M160 236 L108 272 L122 330" fill="none" stroke="#151515" stroke-width="50"/>
    <path d="M160 236 L108 272 L122 330" fill="none" stroke="#c4211a" stroke-width="38"/>
    <path d="M240 236 L292 272 L278 330" fill="none" stroke="#151515" stroke-width="50"/>
    <path d="M240 236 L292 272 L278 330" fill="none" stroke="#c4211a" stroke-width="38"/>
    <path d="M100 322 L140 322 L140 346 L100 346 Z" fill="#2a2b2d"/><path d="M300 322 L260 322 L260 346 L300 346 Z" fill="#2a2b2d"/>
    <!-- tail cowl, light, plate -->
    <path d="M150 300 L250 300 L236 254 L164 254 Z" fill="#e0301e"/>
    <path d="M168 280 L232 280 L228 294 L172 294 Z" fill="#ff5a3c" class="tail"/>
    <rect x="170" y="304" width="60" height="30" rx="3" fill="#f4f1ea"/>
    <text x="200" y="327" text-anchor="middle" font-family="Arial Narrow,Arial,sans-serif" font-weight="900" font-style="italic" font-size="22" fill="#151515" stroke="none">CK95</text>
    <!-- back of the suit -->
    <path d="M140 252 C132 210 132 170 146 138 L254 138 C268 170 268 210 260 252 Z" fill="#e0301e"/>
    <path d="M200 138 L200 252" stroke="#f4f1ea" stroke-width="7"/>
    <path d="M150 150 C142 190 144 222 150 250 M250 150 C258 190 256 222 250 250" fill="none" stroke="#f4c21b" stroke-width="5"/>
    <text x="200" y="196" text-anchor="middle" font-family="Arial Narrow,Arial,sans-serif" font-weight="900" font-size="20" letter-spacing="1" fill="#f4f1ea" stroke="#151515" stroke-width="1.2">KHAMKAR</text>
    <text x="200" y="246" text-anchor="middle" font-family="Arial Narrow,Arial,sans-serif" font-weight="900" font-style="italic" font-size="50" fill="#f4f1ea" stroke="#151515" stroke-width="2">95</text>
    <!-- arms out to the bars -->
    <path d="M150 150 L104 172 L78 182" fill="none" stroke="#151515" stroke-width="40"/><path d="M150 150 L104 172 L78 182" fill="none" stroke="#c4211a" stroke-width="28"/>
    <path d="M250 150 L296 172 L322 182" fill="none" stroke="#151515" stroke-width="40"/><path d="M250 150 L296 172 L322 182" fill="none" stroke="#c4211a" stroke-width="28"/>
    <circle cx="76" cy="184" r="15" fill="#1f1f21"/><circle cx="324" cy="184" r="15" fill="#1f1f21"/>
    <!-- helmet from behind -->
    <circle cx="200" cy="102" r="50" fill="#f4f1ea"/>
    <path d="M152 92 C156 60 180 50 200 50 C220 50 244 60 248 92 C230 84 214 82 200 82 C186 82 170 84 152 92 Z" fill="#d7261e"/>
    <path d="M160 128 C180 140 220 140 240 128" fill="none" stroke="#d7261e" stroke-width="10"/>
  </g>
</svg>
